services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      # Optional: Mount app code for development updates without rebuilding
      # Remove if you want a strictly immutable production container
      - ./backend/app:/app/app
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
